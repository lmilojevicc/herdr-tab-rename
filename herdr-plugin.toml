id = "herdr-tab-rename"
name = "Tab Auto-Rename"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Auto-rename each tab to its focused pane's working-directory name. Manually renamed tabs are left alone."
platforms = ["linux", "macos"]

[[build]]
platforms = ["linux", "macos"]
command = ["bash", "scripts/install.sh"]

[[actions]]
id = "start"
title = "Start tab auto-rename"
contexts = ["workspace"]
command = ["./herdr-tab-rename", "start"]

[[events]]
on = "pane.created"
command = ["./herdr-tab-rename", "start"]
